<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cohen-Sutherland | Ingreso de Coordenadas</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background-color: #1a1a2e;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Courier New', Courier, monospace;
            color: #eee;
            padding: 20px;
        }
        
        h1 {
            color: #4ecdc4;
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        .subtitulo {
            color: #f7fff7;
            margin-bottom: 20px;
            font-size: 16px;
        }
        
        /* Formularios de entrada */
        .contenedor-formularios {
            display: flex;
            gap: 30px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .formulario {
            background-color: #16213e;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            min-width: 300px;
        }
        
        .formulario h3 {
            color: #4ecdc4;
            margin-bottom: 15px;
            text-align: center;
            border-bottom: 1px solid #2d2d44;
            padding-bottom: 10px;
        }
        
        .campo {
            margin-bottom: 12px;
        }
        
        .campo label {
            display: inline-block;
            width: 60px;
            color: #a8dadc;
        }
        
        .campo input {
            width: 100px;
            padding: 5px 8px;
            background-color: #0f0f1a;
            border: 1px solid #2d2d44;
            color: #f1fa8c;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            border-radius: 4px;
        }
        
        .coordenadas-linea {
            display: flex;
            gap: 20px;
            justify-content: space-around;
        }
        
        .punto {
            text-align: center;
        }
        
        .punto h4 {
            color: #e63946;
            margin-bottom: 8px;
        }
        
        .botones {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 15px;
        }
        
        .btn {
            padding: 8px 16px;
            background-color: #4ecdc4;
            color: #1a1a2e;
            border: none;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn:hover {
            background-color: #6ee7df;
            transform: scale(1.05);
        }
        
        .btn-secundario {
            background-color: #457b9d;
            color: white;
        }
        
        .btn-secundario:hover {
            background-color: #5a9ec9;
        }
        
        .contenedor-canvas {
            background-color: #0f0f1a;
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        
        canvas {
            display: block;
            border: 2px solid #2d2d44;
            cursor: crosshair;
            background-color: #000000;
        }
    </style>
</head>
<body>
    <h1> Algoritmo Cohen-Sutherland</h1>
    <div class="subtitulo">Operaciones OR y AND - Ingreso de Coordenadas</div>
    
    <!-- FORMULARIOS PARA INGRESO DE DATOS -->
    <div class="contenedor-formularios">
        <!-- Formulario del Viewport -->
        <div class="formulario">
            <h3> VIEWPORT</h3>
            <div class="campo">
                <label>Xmin:</label>
                <input type="number" id="inputXmin" value="200" min="0" max="800">
            </div>
            <div class="campo">
                <label>Xmax:</label>
                <input type="number" id="inputXmax" value="600" min="0" max="800">
            </div>
            <div class="campo">
                <label>Ymin:</label>
                <input type="number" id="inputYmin" value="150" min="0" max="600">
            </div>
            <div class="campo">
                <label>Ymax:</label>
                <input type="number" id="inputYmax" value="450" min="0" max="600">
            </div>
            <div class="botones">
                <button class="btn" id="btnActualizarViewport">Actualizar Viewport</button>
            </div>
        </div>
        
        <!-- Formulario de la Línea -->
        <div class="formulario">
            <h3> LÍNEA</h3>
            <div class="coordenadas-linea">
                <div class="punto">
                    <h4>Punto 1 (P1)</h4>
                    <div class="campo">
                        <label>X1:</label>
                        <input type="number" id="inputX1" value="100" min="0" max="800">
                    </div>
                    <div class="campo">
                        <label>Y1:</label>
                        <input type="number" id="inputY1" value="100" min="0" max="600">
                    </div>
                </div>
                <div class="punto">
                    <h4>Punto 2 (P2)</h4>
                    <div class="campo">
                        <label>X2:</label>
                        <input type="number" id="inputX2" value="700" min="0" max="800">
                    </div>
                    <div class="campo">
                        <label>Y2:</label>
                        <input type="number" id="inputY2" value="500" min="0" max="600">
                    </div>
                </div>
            </div>
            <div class="botones">
                <button class="btn" id="btnActualizarLinea">Actualizar Línea</button>
                <button class="btn btn-secundario" id="btnResetear">Resetear</button>
            </div>
        </div>
    </div>
    
    <div class="contenedor-canvas">
        <canvas id="miCanvas" width="800" height="600"></canvas>
    </div>

    <!-- <script src="script.js"></script> -->
</body>
</html>
